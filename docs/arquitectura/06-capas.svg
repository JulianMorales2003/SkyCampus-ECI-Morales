<text x="250" y="146" text-anchor="middle" font-size="14" fill="#475569">JPA y HTTP viven aquí</text>
<rect x="70" y="170" width="360" height="90" rx="8" fill="#fff" stroke="#64748B" stroke-width="1.6"/>
