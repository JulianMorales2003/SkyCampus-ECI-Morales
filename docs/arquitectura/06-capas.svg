<text x="655" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532D">ServicioClima</text>
<text x="655" y="364" text-anchor="middle" font-size="12" fill="#166534">condicionesAptas(o, d)</text>
<rect x="760" y="285" width="170" height="100" rx="8" fill="#fff" stroke="#15803D" stroke-width="1.6"/>
<text x="845" y="310" text-anchor="middle" font-size="13" fill="#166534">«interface»</text>
<text x="845" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532D">ObservadorDrone</text>
<text x="845" y="364" text-anchor="middle" font-size="12" fill="#166534">alOcurrir(evento)</text>
<text x="750" y="408" text-anchor="middle" font-size="13" fill="#166534">records: Drone, SolicitudEntrega, EventoAsignacion</text>

