<text x="750" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0F172A">AsignadorMision en 3 capas: las dependencias apuntan al dominio</text>

<rect x="40" y="90" width="420" height="330" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
