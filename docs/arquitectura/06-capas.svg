<text x="499" y="204" text-anchor="middle" font-size="11" fill="#334155">implementa</text><text x="499" y="324" text-anchor="middle" font-size="11" fill="#334155">implementa</text>
<text x="1001" y="315" text-anchor="middle" font-size="11" fill="#334155">usa los 4</text><text x="1001" y="195" text-anchor="middle" font-size="11" fill="#334155">implementa</text>

<rect x="40" y="480" width="1420" height="230" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
<text x="750" y="516" text-anchor="middle" font-size="20" font-weight="bold" fill="#78350F">En las pruebas: Mockito ocupa el lugar de la infraestructura</text>
<rect x="80" y="545" width="300" height="130" rx="8" fill="#fff" stroke="#B45309" stroke-width="1.6"/>
<text x="230" y="580" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350F">@Mock RepositorioFlota</text>
<text x="230" y="606" text-anchor="middle" font-size="14" fill="#92400E">sin base de datos</text>
<text x="230" y="640" text-anchor="middle" font-size="12" fill="#92400E">when(...).thenReturn(lista)</text>
<rect x="420" y="545" width="300" height="130" rx="8" fill="#fff" stroke="#B45309" stroke-width="1.6"/>
<text x="570" y="580" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350F">@Mock ServicioClima</text>
<text x="570" y="606" text-anchor="middle" font-size="14" fill="#92400E">sin llamada HTTP</text>
<text x="570" y="640" text-anchor="middle" font-size="12" fill="#92400E">when(...).thenReturn(true / throw)</text>
<rect x="760" y="545" width="300" height="130" rx="8" fill="#fff" stroke="#B45309" stroke-width="1.6"/>
<text x="910" y="580" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350F">@Mock ObservadorDrone</text>
<text x="910" y="606" text-anchor="middle" font-size="14" fill="#92400E">captura el evento</text>
<text x="910" y="640" text-anchor="middle" font-size="12" fill="#92400E">verify + ArgumentCaptor</text>
<rect x="1100" y="545" width="320" height="130" rx="8" fill="#fff" stroke="#1D4ED8" stroke-width="1.6"/>
<text x="1260" y="580" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A8A">new AsignadorMision(...)</text>
<text x="1260" y="606" text-anchor="middle" font-size="14" fill="#1E40AF">clase real bajo prueba</text>
<text x="1260" y="640" text-anchor="middle" font-size="12" fill="#1E40AF">recibe los mocks por constructor</text>
