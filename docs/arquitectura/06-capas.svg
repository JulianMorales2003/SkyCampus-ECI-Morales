<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="DejaVu Sans, Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1500" height="760" fill="#FFFFFF"/>
