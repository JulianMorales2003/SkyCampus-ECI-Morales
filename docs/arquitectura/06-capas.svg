<text x="845" y="190" text-anchor="middle" font-size="13" fill="#166534">«interface»</text>
<text x="845" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532D">EstrategiaAsignacion</text>
<text x="845" y="244" text-anchor="middle" font-size="12" fill="#166534">seleccionar(sol, lista)</text>
