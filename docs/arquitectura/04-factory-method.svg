<text x="72" y="562" font-size="13" font-weight="700" fill="#7E22CE" text-anchor="start">Una familia, un método de fábrica</text>
<text x="72" y="584" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">TipoDrone es una sola familia de productos, por eso alcanza un Factory Method y no un Abstract Factory.</text>
<text x="72" y="602" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">La etapa no cambia si la sede usa FabricaDroneEstandar o FabricaDroneUrgente.</text>
<text x="72" y="620" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Si la fábrica devuelve un drone que no alcanza, prepararPara lanza TramoSinDroneException.</text>
