<path d="M60,520 L706,520 L720,534 L720,620 L60,620 Z" fill="#15803D" fill-opacity="0.07" stroke="#15803D" stroke-width="1.3"/>
<text x="72" y="542" font-size="13" font-weight="700" fill="#15803D" text-anchor="start">Misma entrada, distinto algoritmo</text>
<text x="72" y="564" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Las tres estrategias se prueban con las mismas candidatas y eligen distinto:</text>
<text x="72" y="582" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">la directa (menos km), la de carga corta (menos minutos) o la que no recarga.</text>
<text x="72" y="600" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Si dos rutas empatan en el criterio, el desempate es siempre el mismo (determinista).</text>
