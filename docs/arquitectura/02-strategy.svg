="6" orient="auto" markerUnits="userSpaceOnUse"><polyline points="1,1 13,6 1,11" fill="none" stroke="#334155" stroke-width="1.8"/></marker></defs>
<text x="40" y="46" font-size="24" font-weight="700" fill="#111827" text-anchor="start">Strategy: algoritmos de optimización de ruta</text>
<text x="40" y="72" font-size="14" font-weight="400" fill="#475569" text-anchor="start">El planificador arma las rutas posibles y la estrategia decide cuál es la mejor; cambiar de criterio no toca el planificador</text>
