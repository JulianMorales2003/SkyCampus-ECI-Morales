<text x="40" y="46" font-size="24" font-weight="700" fill="#111827" text-anchor="start">Composite: rutas simples y compuestas</text>
<text x="40" y="72" font-size="14" font-weight="400" fill="#475569" text-anchor="start">El GestorMisiones ejecuta cualquier Ruta de la misma manera, sin saber si es simple o compuesta</text>
