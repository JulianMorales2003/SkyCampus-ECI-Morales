<text x="72" y="602" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">Problema 1 resuelto</text>
<text x="72" y="624" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Una ruta A → estación de carga → B es una RutaCompuesta de tres etapas:</text>
<text x="72" y="642" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">TramoSimple, ParadaDeCarga y TramoSimple. Una ruta A → B es solo un TramoSimple.</text>
<text x="72" y="660" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Para el cliente son lo mismo: ruta.ejecutar(contexto).</text>
<text x="1210" y="120" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="start">Ejemplo de ruta con 3 niveles</text>
<rect x="1260" y="150" width="340" height="46" rx="6" fill="#1D4ED8" fill-opacity="0.12" stroke="#1D4ED8" stroke-width="1.8"/>
<text x="1430.0" y="170" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Viaje ECI → Uniandes</text>
<text x="1430.0" y="187" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">RutaCompuesta (nivel 1)</text>
<rect x="1210" y="250" width="220" height="46" rx="6" fill="#1D4ED8" fill-opacity="0.12" stroke="#1D4ED8" stroke-width="1.8"/>
<text x="1320.0" y="270" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">ECI → UNAL</text>
<text x="1320.0" y="287" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">RutaCompuesta (nivel 2)</text>
<rect x="1460" y="250" width="190" height="46" rx="6" fill="#fff" fill-opacity="1" stroke="#1D4ED8" stroke-width="1.8"/>
<text x="1555.0" y="270" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Tramo UNAL → Uniandes</text>
<text x="1555.0" y="287" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">TramoSimple (nivel 2)</text>
<rect x="1160" y="360" width="150" height="46" rx="6" fill="#fff" fill-opacity="1" stroke="#1D4ED8" stroke-width="1.8"/>
<text x="1235.0" y="380" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Tramo ECI → Norte</text>
<text x="1235.0" y="397" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">TramoSimple (nivel 3)</text>
<rect x="1330" y="360" width="150" height="46" rx="6" fill="#fff" fill-opacity="1" stroke="#1D4ED8" stroke-width="1.8"/>
<text x="1405.0" y="380" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Carga en Norte</text>
<text x="1405.0" y="397" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">ParadaDeCarga (nivel 3)</text>
<rect x="1500" y="360" width="150" height="46" rx="6" fill="#fff" fill-opacity="1" stroke="#1D4ED8" stroke-width="1.8"/>
<text x="1575.0" y="380" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">Tramo Norte → UNAL</text>
<text x="1575.0" y="397" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">TramoSimple (nivel 3)</text>
<line x1="1430" y1="196" x2="1320" y2="250" stroke="#1D4ED8" stroke-width="1.5"/>
<line x1="1430" y1="196" x2="1555" y2="250" stroke="#1D4ED8" stroke-width="1.5"/>
<line x1="1320" y1="296" x2="1235" y2="360" stroke="#1D4ED8" stroke-width="1.5"/>
<line x1="1320" y1="296" x2="1405" y2="360" stroke="#1D4ED8" stroke-width="1.5"/>
<line x1="1320" y1="296" x2="1575" y2="360" stroke="#1D4ED8" stroke-width="1.5"/>
<line x1="1210" y1="440" x2="1650" y2="440" stroke="#94A3B8" stroke-dasharray="4 4"/>
<text x="1210" y="462" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Con tres niveles el Composite se justifica: una lista simple no podría</text>
<text x="1210" y="480" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">representar un viaje que contiene otros viajes con sus propias paradas.</text>
