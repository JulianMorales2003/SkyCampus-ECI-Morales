<text x="72" y="604" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Los observadores se suscriben al NotificadorRuta; las etapas solo lo conocen a él.</text>
<text x="72" y="622" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Agregar un tercer observador (por ejemplo, un panel de sede) no cambia ninguna etapa.</text>
<text x="72" y="640" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Cada observador decide qué eventos le interesan: el registro guarda todos y la alerta solo los fallos.</text>
