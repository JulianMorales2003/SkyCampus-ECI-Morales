<text x="72" y="814" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Flujo: el gestor pide una ruta al planificador (Strategy),</text>
<text x="72" y="832" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">la ejecuta sin saber si es simple o compuesta (Composite),</text>
<text x="72" y="850" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">cada tramo pide su drone a la fábrica (Factory Method)</text>
<text x="72" y="868" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">y cada etapa avisa su resultado a los observadores (Observer).</text>
