<rect x="1059.0" y="252" width="2" height="138" rx="0" fill="#94A3B8"/>
<text x="1060.0" y="246" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">máx. 2000 g</text>
<text x="704" y="410" font-size="14" font-weight="700" fill="#F1F5F9" text-anchor="start">Máximo que puede llevar la flota: 2000 g (CARGO).</text>
<text x="704" y="434" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Tu paquete: 2500 g, 500 g por encima del máximo.</text>
<text x="704" y="474" font-size="14" font-weight="600" fill="#F1F5F9" text-anchor="start">Drones aptos para este peso: ninguno.</text>
<text x="704" y="502" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Corrige el peso o divide el envío en dos misiones.</text>
