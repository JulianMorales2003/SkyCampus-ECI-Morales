<text x="48" y="1014" font-size="13" fill="#111827">Las dos aplicaciones hablan solo con el API Gateway, y los servicios no se llaman entre sí en el diagrama. Cada servicio es dueño de sus datos: Misiones y Flota tienen su propia base de datos; Rutas y Analytics no</text>
