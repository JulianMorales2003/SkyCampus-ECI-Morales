<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1100" viewBox="0 0 1840 1100" font-family="Segoe UI, Helvetica, Arial, DejaVu Sans, sans-serif">
<defs><marker id="f4B5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="fB45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="1840" height="1100" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#111827">Diagrama de contexto (C4, nivel 1) — SkyCampus v2</text>
<text x="30" y="64" font-size="14" fill="#4B5563">Escuela Colombiana de Ingeniería · DOSW 2026-2 · Cada flecha indica qué datos fluyen y en qué dirección · En naranja, lo nuevo respecto al MVP</text>
<rect x="1180" y="28" width="16" height="16" rx="3" fill="#08427B"/><text x="1202" y="41" font-size="13" fill="#111827">Persona</text>
<rect x="1280" y="28" width="16" height="16" rx="3" fill="#1168BD"/><text x="1302" y="41" font-size="13" fill="#111827">Sistema de software</text>
<rect x="1450" y="28" width="16" height="16" rx="3" fill="#6B7280"/><text x="1472" y="41" font-size="13" fill="#111827">Sistema externo</text>
<rect x="1600" y="28" width="16" height="16" rx="3" fill="#ffffff" stroke="#B45309" stroke-width="3"/><text x="1622" y="41" font-size="13" fill="#111827">Nuevo en v2</text>
<rect x="770" y="100" width="300" height="860" rx="10" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
<text x="920.0" y="410" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">SkyCampus v2</text>
<text x="920.0" y="438" text-anchor="middle" font-size="14" fill="#DBEAFE">[Sistema de software]</text>
<text x="920.0" y="472" text-anchor="middle" font-size="15" fill="#ffffff">Gestiona la flota de drones de</text>
<text x="920.0" y="492" text-anchor="middle" font-size="15" fill="#ffffff">reparto, las misiones y su entrega</text>
<text x="920.0" y="512" text-anchor="middle" font-size="15" fill="#ffffff">dentro del campus de la ECI, y ahora</text>
<text x="920.0" y="532" text-anchor="middle" font-size="15" fill="#ffffff">consulta el clima, avisa al control</text>
<text x="920.0" y="552" text-anchor="middle" font-size="15" fill="#ffffff">aéreo y alerta los fallos</text>
<rect x="30" y="130" width="240" height="110" rx="10" fill="#08427B" stroke="#052E56" stroke-width="2"/>
<text x="150.0" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Operador de drones</text>
<text x="150.0" y="184" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona]</text>
<text x="150.0" y="208" text-anchor="middle" font-size="14" fill="#ffffff">Asigna misiones y monitorea la</text>
<text x="150.0" y="225" text-anchor="middle" font-size="14" fill="#ffffff">flota</text>
<rect x="30" y="360" width="240" height="110" rx="10" fill="#08427B" stroke="#052E56" stroke-width="2"/>
<text x="150.0" y="394" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Solicitante</text>
<text x="150.0" y="414" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona]</text>
<text x="150.0" y="438" text-anchor="middle" font-size="14" fill="#ffffff">Quien pide el reparto de un</text>
<text x="150.0" y="455" text-anchor="middle" font-size="14" fill="#ffffff">documento</text>
<rect x="30" y="590" width="240" height="110" rx="10" fill="#08427B" stroke="#052E56" stroke-width="2"/>
<text x="150.0" y="624" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Admin</text>
<text x="150.0" y="644" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona]</text>
<text x="150.0" y="668" text-anchor="middle" font-size="14" fill="#ffffff">Configura destinos y flota</text>
<rect x="30" y="820" width="240" height="110" rx="10" fill="#08427B" stroke="#B45309" stroke-width="4"/>
<text x="150.0" y="854" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Técnico de mantenimiento</text>
<text x="150.0" y="874" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona · nuevo]</text>
<text x="150.0" y="898" text-anchor="middle" font-size="14" fill="#ffffff">Revisa y repara los drones que</text>
<text x="150.0" y="915" text-anchor="middle" font-size="14" fill="#ffffff">fallan</text>
<rect x="1570" y="160" width="240" height="110" rx="10" fill="#6B7280" stroke="#B45309" stroke-width="4"/>
<text x="1690.0" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">API Meteorológica</text>
<text x="1690.0" y="214" text-anchor="middle" font-size="13" fill="#E5E7EB">[Sistema externo · nuevo]</text>
<text x="1690.0" y="238" text-anchor="middle" font-size="14" fill="#ffffff">Condiciones de viento y lluvia</text>
<text x="1690.0" y="255" text-anchor="middle" font-size="14" fill="#ffffff">del campus</text>
<rect x="1570" y="430" width="240" height="110" rx="10" fill="#6B7280" stroke="#B45309" stroke-width="4"/>
<text x="1690.0" y="464" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Control Aéreo ECI</text>
<text x="1690.0" y="484" text-anchor="middle" font-size="13" fill="#E5E7EB">[Sistema externo · nuevo]</text>
<text x="1690.0" y="508" text-anchor="middle" font-size="14" fill="#ffffff">Autoriza y registra los vuelos</text>
<text x="1690.0" y="525" text-anchor="middle" font-size="14" fill="#ffffff">sobre el campus</text>
<rect x="1570" y="760" width="240" height="110" rx="10" fill="#6B7280" stroke="#B45309" stroke-width="4"/>
<text x="1690.0" y="794" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Sistema de Alertas</text>
<text x="1690.0" y="814" text-anchor="middle" font-size="13" fill="#E5E7EB">[Sistema externo · nuevo]</text>
<text x="1690.0" y="838" text-anchor="middle" font-size="14" fill="#ffffff">Entrega avisos al personal de</text>
<text x="1690.0" y="855" text-anchor="middle" font-size="14" fill="#ffffff">mantenimiento</text>
<line x1="270" y1="162" x2="770" y2="162" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="120" text-anchor="middle" font-size="14" fill="#111827">1. Registra la misión: código de la solicitud + id</text>
<text x="520.0" y="137" text-anchor="middle" font-size="14" fill="#111827">del drone elegido; confirma la entrega con el</text>
<text x="520.0" y="154" text-anchor="middle" font-size="14" fill="#111827">código de la misión</text>
<line x1="770" y1="208" x2="270" y2="208" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="228" text-anchor="middle" font-size="14" fill="#111827">2. Solicitudes pendientes (código, origen,</text>
<text x="520.0" y="245" text-anchor="middle" font-size="14" fill="#111827">destino, tipo de carga); drones disponibles con</text>
<text x="520.0" y="262" text-anchor="middle" font-size="14" fill="#111827">batería y ubicación; misiones con su estado</text>
<line x1="270" y1="392" x2="770" y2="392" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="367" text-anchor="middle" font-size="14" fill="#111827">3. Registra la solicitud de reparto: origen,</text>
<text x="520.0" y="384" text-anchor="middle" font-size="14" fill="#111827">destino y tipo de carga (SOBRE, CARPETA, LIBRO)</text>
<line x1="770" y1="438" x2="270" y2="438" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="458" text-anchor="middle" font-size="14" fill="#111827">4. Código de seguimiento de la solicitud y su</text>
<text x="520.0" y="475" text-anchor="middle" font-size="14" fill="#111827">estado (pendiente, rechazada con su motivo,</text>
<text x="520.0" y="492" text-anchor="middle" font-size="14" fill="#111827">cancelada, o el estado de la misión)</text>
<line x1="270" y1="622" x2="770" y2="622" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="597" text-anchor="middle" font-size="14" fill="#111827">5. Configura los destinos válidos (Bloque A-D,</text>
<text x="520.0" y="614" text-anchor="middle" font-size="14" fill="#111827">Biblioteca) y la flota de drones (id, modelo)</text>
<line x1="770" y1="668" x2="270" y2="668" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="688" text-anchor="middle" font-size="14" fill="#111827">6. Confirmación de la configuración y listado</text>
<text x="520.0" y="705" text-anchor="middle" font-size="14" fill="#111827">vigente de destinos y drones</text>
<line x1="270" y1="852" x2="770" y2="852" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="520.0" y="810" text-anchor="middle" font-size="14" fill="#111827">7. Registra el resultado de la revisión: id del</text>
<text x="520.0" y="827" text-anchor="middle" font-size="14" fill="#111827">drone y su nuevo estado (reparado o sigue en</text>
<text x="520.0" y="844" text-anchor="middle" font-size="14" fill="#111827">FALLO)</text>
<line x1="770" y1="898" x2="270" y2="898" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="520.0" y="918" text-anchor="middle" font-size="14" fill="#111827">8. Drones en estado FALLO pendientes de revisión:</text>
<text x="520.0" y="935" text-anchor="middle" font-size="14" fill="#111827">id, tipo, nivel de batería y hora del fallo</text>
<line x1="1570" y1="192" x2="1070" y2="192" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="1320.0" y="150" text-anchor="middle" font-size="14" fill="#111827">9. Condiciones previas al lanzamiento: velocidad</text>
<text x="1320.0" y="167" text-anchor="middle" font-size="14" fill="#111827">del viento, lluvia y hora de la medición para la</text>
<text x="1320.0" y="184" text-anchor="middle" font-size="14" fill="#111827">zona del campus</text>
<line x1="1070" y1="458" x2="1570" y2="458" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="1320.0" y="433" text-anchor="middle" font-size="14" fill="#111827">10. Registro de vuelo: id de la misión y del</text>
<text x="1320.0" y="450" text-anchor="middle" font-size="14" fill="#111827">drone, origen, destino y hora estimada de salida</text>
<line x1="1570" y1="520" x2="1070" y2="520" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="1320.0" y="540" text-anchor="middle" font-size="14" fill="#111827">11. Autorización o rechazo de la ruta, con el</text>
<text x="1320.0" y="557" text-anchor="middle" font-size="14" fill="#111827">motivo si se rechaza</text>
<line x1="1070" y1="792" x2="1570" y2="792" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="1320.0" y="812" text-anchor="middle" font-size="14" fill="#111827">12. Notificación de fallo: id del drone, hora y</text>
<text x="1320.0" y="829" text-anchor="middle" font-size="14" fill="#111827">último estado conocido, cuando el drone entra en</text>
<text x="1320.0" y="846" text-anchor="middle" font-size="14" fill="#111827">estado FALLO</text>
<rect x="30" y="990" width="1780" height="72" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-dasharray="6 4"/>
<text x="48" y="1018" font-size="13" fill="#111827">Sigue sin dibujarse la base de datos, el correo ni el PDF: son detalles de implementación (nivel 2 de C4). Los 3 sistemas externos son lo que cambia respecto al MVP. En el código v2 la alerta técnica ya existe como</text>
<text x="48" y="1038" font-size="13" fill="#111827">observador; el clima y el control aéreo son la integración que falta construir.</text>
</svg>