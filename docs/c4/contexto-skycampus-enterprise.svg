<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1730" viewBox="0 0 1840 1730" font-family="Segoe UI, Helvetica, Arial, DejaVu Sans, sans-serif">
<defs><marker id="f4B5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="fB45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="1840" height="1730" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#111827">Diagrama de contexto (C4, nivel 1) — SkyCampus Enterprise</text>
<text x="30" y="64" font-size="14" fill="#4B5563">Escuela Colombiana de Ingeniería · DOSW 2026-2 · Cada flecha indica qué datos fluyen y en qué dirección · En naranja, lo nuevo respecto a v2</text>
<rect x="1180" y="28" width="16" height="16" rx="3" fill="#08427B"/><text x="1202" y="41" font-size="13" fill="#111827">Persona</text>
<rect x="1280" y="28" width="16" height="16" rx="3" fill="#1168BD"/><text x="1302" y="41" font-size="13" fill="#111827">Sistema de software</text>
<rect x="1450" y="28" width="16" height="16" rx="3" fill="#6B7280"/><text x="1472" y="41" font-size="13" fill="#111827">Sistema externo</text>
<rect x="1600" y="28" width="16" height="16" rx="3" fill="#ffffff" stroke="#B45309" stroke-width="3"/><text x="1622" y="41" font-size="13" fill="#111827">Nuevo en Enterprise</text>
<rect x="770" y="100" width="300" height="1510" rx="10" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
<text x="920.0" y="785.0" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">SkyCampus Enterprise</text>
<text x="920.0" y="813.0" text-anchor="middle" font-size="14" fill="#DBEAFE">[Sistema de software]</text>
<text x="920.0" y="847.0" text-anchor="middle" font-size="15" fill="#ffffff">Gestiona la flota, las misiones y</text>
<text x="920.0" y="867.0" text-anchor="middle" font-size="15" fill="#ffffff">las rutas de entrega de la red de</text>
<text x="920.0" y="887.0" text-anchor="middle" font-size="15" fill="#ffffff">4 sedes universitarias; consulta el</text>
<text x="920.0" y="907.0" text-anchor="middle" font-size="15" fill="#ffffff">clima, pide autorización de vuelo,</text>
<text x="920.0" y="927.0" text-anchor="middle" font-size="15" fill="#ffffff">alerta los fallos, se integra con el</text>
<text x="920.0" y="947.0" text-anchor="middle" font-size="15" fill="#ffffff">ERP y envía su operación a analytics</text>
<rect x="30" y="130" width="240" height="110" rx="10" fill="#08427B" stroke="#052E56" stroke-width="2"/>
<text x="150.0" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Operador de drones</text>
<text x="150.0" y="180" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona]</text>
<text x="150.0" y="204" text-anchor="middle" font-size="14" fill="#ffffff">Asigna misiones y monitorea la</text>
<text x="150.0" y="221" text-anchor="middle" font-size="14" fill="#ffffff">flota de su sede</text>
<rect x="30" y="380" width="240" height="110" rx="10" fill="#08427B" stroke="#052E56" stroke-width="2"/>
<text x="150.0" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Solicitante</text>
<text x="150.0" y="430" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona]</text>
<text x="150.0" y="454" text-anchor="middle" font-size="14" fill="#ffffff">Quien pide el reparto de un</text>
<text x="150.0" y="471" text-anchor="middle" font-size="14" fill="#ffffff">documento</text>
<rect x="30" y="630" width="240" height="110" rx="10" fill="#08427B" stroke="#052E56" stroke-width="2"/>
<text x="150.0" y="660" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Admin</text>
<text x="150.0" y="680" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona]</text>
<text x="150.0" y="704" text-anchor="middle" font-size="14" fill="#ffffff">Configura destinos y flota</text>
<rect x="30" y="880" width="240" height="110" rx="10" fill="#08427B" stroke="#052E56" stroke-width="2"/>
<text x="150.0" y="910" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Técnico de mantenimiento</text>
<text x="150.0" y="930" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona]</text>
<text x="150.0" y="954" text-anchor="middle" font-size="14" fill="#ffffff">Revisa y repara los drones que</text>
<text x="150.0" y="971" text-anchor="middle" font-size="14" fill="#ffffff">fallan</text>
<rect x="30" y="1130" width="240" height="110" rx="10" fill="#08427B" stroke="#B45309" stroke-width="4"/>
<text x="150.0" y="1160" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Superadmin</text>
<text x="150.0" y="1180" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona · nuevo]</text>
<text x="150.0" y="1204" text-anchor="middle" font-size="14" fill="#ffffff">Administra la red completa de</text>
<text x="150.0" y="1221" text-anchor="middle" font-size="14" fill="#ffffff">sedes</text>
<rect x="30" y="1380" width="240" height="110" rx="10" fill="#08427B" stroke="#B45309" stroke-width="4"/>
<text x="150.0" y="1410" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Coordinador de sede</text>
<text x="150.0" y="1430" text-anchor="middle" font-size="13" fill="#BFDBFE">[Persona · nuevo]</text>
<text x="150.0" y="1454" text-anchor="middle" font-size="14" fill="#ffffff">Responsable de las operaciones</text>
<text x="150.0" y="1471" text-anchor="middle" font-size="14" fill="#ffffff">de una sede</text>
<rect x="1570" y="150" width="240" height="110" rx="10" fill="#6B7280" stroke="#4B5563" stroke-width="2"/>
<text x="1690.0" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">API Meteorológica</text>
<text x="1690.0" y="200" text-anchor="middle" font-size="13" fill="#E5E7EB">[Sistema externo]</text>
<text x="1690.0" y="224" text-anchor="middle" font-size="14" fill="#ffffff">Condiciones de viento y</text>
<text x="1690.0" y="241" text-anchor="middle" font-size="14" fill="#ffffff">lluvia</text>
<rect x="1570" y="400" width="240" height="110" rx="10" fill="#6B7280" stroke="#4B5563" stroke-width="2"/>
<text x="1690.0" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Control Aéreo ECI</text>
<text x="1690.0" y="450" text-anchor="middle" font-size="13" fill="#E5E7EB">[Sistema externo]</text>
<text x="1690.0" y="474" text-anchor="middle" font-size="14" fill="#ffffff">Autoriza y registra los</text>
<text x="1690.0" y="491" text-anchor="middle" font-size="14" fill="#ffffff">vuelos sobre el campus</text>
<rect x="1570" y="650" width="240" height="110" rx="10" fill="#6B7280" stroke="#4B5563" stroke-width="2"/>
<text x="1690.0" y="680" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Sistema de Alertas</text>
<text x="1690.0" y="700" text-anchor="middle" font-size="13" fill="#E5E7EB">[Sistema externo]</text>
<text x="1690.0" y="724" text-anchor="middle" font-size="14" fill="#ffffff">Entrega avisos al personal</text>
<text x="1690.0" y="741" text-anchor="middle" font-size="14" fill="#ffffff">de mantenimiento</text>
<rect x="1570" y="900" width="240" height="110" rx="10" fill="#6B7280" stroke="#B45309" stroke-width="4"/>
<text x="1690.0" y="930" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Aerocivil</text>
<text x="1690.0" y="950" text-anchor="middle" font-size="13" fill="#E5E7EB">[Sistema externo · nuevo]</text>
<text x="1690.0" y="974" text-anchor="middle" font-size="14" fill="#ffffff">Autoriza vuelos fuera del</text>
<text x="1690.0" y="991" text-anchor="middle" font-size="14" fill="#ffffff">campus, entre sedes</text>
<rect x="1570" y="1150" width="240" height="110" rx="10" fill="#6B7280" stroke="#B45309" stroke-width="4"/>
<text x="1690.0" y="1180" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">ERP universitario</text>
<text x="1690.0" y="1200" text-anchor="middle" font-size="13" fill="#E5E7EB">[Sistema externo · nuevo]</text>
<text x="1690.0" y="1224" text-anchor="middle" font-size="14" fill="#ffffff">Sedes, usuarios habilitados</text>
<text x="1690.0" y="1241" text-anchor="middle" font-size="14" fill="#ffffff">y centros de costo</text>
<rect x="1570" y="1400" width="240" height="110" rx="10" fill="#6B7280" stroke="#B45309" stroke-width="4"/>
<text x="1690.0" y="1430" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Plataforma de Analytics</text>
<text x="1690.0" y="1450" text-anchor="middle" font-size="13" fill="#E5E7EB">[Sistema externo · nuevo]</text>
<text x="1690.0" y="1474" text-anchor="middle" font-size="14" fill="#ffffff">Análisis de la operación de</text>
<text x="1690.0" y="1491" text-anchor="middle" font-size="14" fill="#ffffff">toda la red</text>
<line x1="270" y1="162" x2="770" y2="162" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="120" text-anchor="middle" font-size="14" fill="#111827">1. Registra la misión: código de la solicitud + id</text>
<text x="520.0" y="137" text-anchor="middle" font-size="14" fill="#111827">del drone elegido; confirma la entrega con el</text>
<text x="520.0" y="154" text-anchor="middle" font-size="14" fill="#111827">código de la misión</text>
<line x1="770" y1="208" x2="270" y2="208" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="228" text-anchor="middle" font-size="14" fill="#111827">2. Solicitudes pendientes, drones disponibles con</text>
<text x="520.0" y="245" text-anchor="middle" font-size="14" fill="#111827">batería y ubicación, y misiones con su estado</text>
<line x1="270" y1="412" x2="770" y2="412" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="387" text-anchor="middle" font-size="14" fill="#111827">3. Registra la solicitud de reparto: origen,</text>
<text x="520.0" y="404" text-anchor="middle" font-size="14" fill="#111827">destino y tipo de carga (SOBRE, CARPETA, LIBRO)</text>
<line x1="770" y1="458" x2="270" y2="458" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="478" text-anchor="middle" font-size="14" fill="#111827">4. Código de seguimiento de la solicitud y su</text>
<text x="520.0" y="495" text-anchor="middle" font-size="14" fill="#111827">estado</text>
<line x1="270" y1="662" x2="770" y2="662" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="637" text-anchor="middle" font-size="14" fill="#111827">5. Configura los destinos válidos y la flota de</text>
<text x="520.0" y="654" text-anchor="middle" font-size="14" fill="#111827">drones (id, modelo)</text>
<line x1="770" y1="708" x2="270" y2="708" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="728" text-anchor="middle" font-size="14" fill="#111827">6. Confirmación de la configuración y listado</text>
<text x="520.0" y="745" text-anchor="middle" font-size="14" fill="#111827">vigente de destinos y drones</text>
<line x1="270" y1="912" x2="770" y2="912" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="870" text-anchor="middle" font-size="14" fill="#111827">7. Registra el resultado de la revisión: id del</text>
<text x="520.0" y="887" text-anchor="middle" font-size="14" fill="#111827">drone y su nuevo estado (reparado o sigue en</text>
<text x="520.0" y="904" text-anchor="middle" font-size="14" fill="#111827">FALLO)</text>
<line x1="770" y1="958" x2="270" y2="958" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="520.0" y="978" text-anchor="middle" font-size="14" fill="#111827">8. Drones en estado FALLO pendientes de revisión:</text>
<text x="520.0" y="995" text-anchor="middle" font-size="14" fill="#111827">id, tipo, batería y hora del fallo</text>
<line x1="270" y1="1162" x2="770" y2="1162" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="520.0" y="1137" text-anchor="middle" font-size="14" fill="#111827">13. Configura la red: sedes, políticas de vuelo y</text>
<text x="520.0" y="1154" text-anchor="middle" font-size="14" fill="#111827">usuarios de cada sede</text>
<line x1="770" y1="1208" x2="270" y2="1208" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="520.0" y="1228" text-anchor="middle" font-size="14" fill="#111827">14. Panorama consolidado de la red: eficiencia por</text>
<text x="520.0" y="1245" text-anchor="middle" font-size="14" fill="#111827">sede, misiones y alertas</text>
<line x1="270" y1="1412" x2="770" y2="1412" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="520.0" y="1387" text-anchor="middle" font-size="14" fill="#111827">15. Aprueba o prioriza las solicitudes de su sede</text>
<text x="520.0" y="1404" text-anchor="middle" font-size="14" fill="#111827">y define qué drones quedan disponibles</text>
<line x1="770" y1="1458" x2="270" y2="1458" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="520.0" y="1478" text-anchor="middle" font-size="14" fill="#111827">16. Estado de su sede: solicitudes, flota y</text>
<text x="520.0" y="1495" text-anchor="middle" font-size="14" fill="#111827">misiones del día</text>
<line x1="1570" y1="182" x2="1070" y2="182" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="1320.0" y="157" text-anchor="middle" font-size="14" fill="#111827">9. Condiciones previas al lanzamiento: viento,</text>
<text x="1320.0" y="174" text-anchor="middle" font-size="14" fill="#111827">lluvia y hora de la medición</text>
<line x1="1070" y1="426" x2="1570" y2="426" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="1320.0" y="401" text-anchor="middle" font-size="14" fill="#111827">10. Registro de vuelo: id de misión y de drone,</text>
<text x="1320.0" y="418" text-anchor="middle" font-size="14" fill="#111827">origen, destino y hora de salida</text>
<line x1="1570" y1="488" x2="1070" y2="488" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="1320.0" y="508" text-anchor="middle" font-size="14" fill="#111827">11. Autorización o rechazo de la ruta, con el</text>
<text x="1320.0" y="525" text-anchor="middle" font-size="14" fill="#111827">motivo si se rechaza</text>
<line x1="1070" y1="682" x2="1570" y2="682" stroke="#4B5563" stroke-width="2" marker-end="url(#f4B5563)"/>
<text x="1320.0" y="657" text-anchor="middle" font-size="14" fill="#111827">12. Notificación de fallo: id del drone, hora y</text>
<text x="1320.0" y="674" text-anchor="middle" font-size="14" fill="#111827">último estado conocido</text>
<line x1="1070" y1="926" x2="1570" y2="926" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="1320.0" y="901" text-anchor="middle" font-size="14" fill="#111827">17. Plan de vuelo de rutas entre sedes: id de</text>
<text x="1320.0" y="918" text-anchor="middle" font-size="14" fill="#111827">misión, ruta, altura y hora estimada</text>
<line x1="1570" y1="988" x2="1070" y2="988" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="1320.0" y="1008" text-anchor="middle" font-size="14" fill="#111827">18. Autorización o rechazo del plan de vuelo</text>
<line x1="1570" y1="1176" x2="1070" y2="1176" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="1320.0" y="1151" text-anchor="middle" font-size="14" fill="#111827">19. Catálogo de sedes y de usuarios habilitados</text>
<text x="1320.0" y="1168" text-anchor="middle" font-size="14" fill="#111827">para pedir entregas</text>
<line x1="1070" y1="1238" x2="1570" y2="1238" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="1320.0" y="1258" text-anchor="middle" font-size="14" fill="#111827">20. Costo y consumo de cada misión, para el centro</text>
<text x="1320.0" y="1275" text-anchor="middle" font-size="14" fill="#111827">de costo</text>
<line x1="1070" y1="1432" x2="1570" y2="1432" stroke="#B45309" stroke-width="2" marker-end="url(#fB45309)"/>
<text x="1320.0" y="1407" text-anchor="middle" font-size="14" fill="#111827">21. Eventos de misiones y flota: misión, sede,</text>
<text x="1320.0" y="1424" text-anchor="middle" font-size="14" fill="#111827">resultado y tiempos</text>
<rect x="30" y="1635" width="1780" height="72" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-dasharray="6 4"/>
<text x="48" y="1663" font-size="13" fill="#111827">Siguen sin dibujarse las bases de datos y los servicios internos: son el nivel 2 (contenedores). Se mantienen los 4 actores y los 12 flujos de v2; los 2 actores, los 3 sistemas externos y los 9 flujos nuevos (13 a</text>
<text x="48" y="1683" font-size="13" fill="#111827">21) son lo que añade la red Enterprise.</text>
</svg>